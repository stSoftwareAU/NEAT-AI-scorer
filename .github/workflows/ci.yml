# Quality bar aligned with NEAT-AI-Discovery (fmt, clippy, tests, security, spell & shell checks).
#
# Job dependency graph (Issue #23):
#
#   validation ──┬── quality ─────────────┐
#                │                         │
#                └── security ─────────────┤
#                                          ├──► ci-required  (aggregator)
#   shell-checks ──────────────────────────┤
#   spell-check ───────────────────────────┘
#
# * `validation` is the foundational check: it verifies the required files
#   and Cargo metadata. Running it first means we do not burn runner minutes
#   on a Rust compile when the repo layout itself is broken.
# * `quality` and `security` depend on `validation` so a missing manifest
#   fails fast without spinning up a full build or security scan.
# * `shell-checks` and `spell-check` are lightweight and independent — they
#   always run in parallel to surface their findings early on every push/PR.
# * `ci-required` is a fan-in aggregator job with `if: always()`. It inspects
#   `needs.<job>.result` and succeeds only when every gating job succeeded
#   (or was cleanly skipped, e.g. `security` on non-PR events). Branch
#   protection should pin exactly one required status check — this one —
#   so the merge-readiness signal is stable regardless of how the underlying
#   graph evolves.
name: CI

on:
  push:
    branches:
      - Develop
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - Develop
      # Milestone sub-issue PRs target a shared `milestone/<slug>` branch
      # (planning delivery workflow). Gate them here so each intermediate PR is
      # checked, not just the single rollup PR into Develop (Issue #393).
      - milestone/*
  workflow_dispatch:

# Least-privilege default token scope (Issue #155). Without this block every
# job would inherit the broad repository/organisation default GITHUB_TOKEN.
# The `quality`, `validation`, `shell-checks` and `spell-check` jobs only read
# the checked-out code, so a read-only default is sufficient. The `security`
# job opts into the wider scopes its reusable workflow needs at the job level
# (see below) — narrowing here, granting there, keeps the blast radius small.
permissions:
  contents: read

# CI is the heaviest workflow (full cargo build/test/doc), so overlapping runs
# are the most expensive. Cancel superseded runs per-ref on rapid pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"

jobs:
  quality:
    name: Quality Checks
    # Foundational layout check must pass before we spend minutes compiling.
    needs: [validation]
    runs-on: ubuntu-latest
    # Full cargo build + test + doc + release; the heaviest job in the graph.
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-D warnings"

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          fetch-depth: 0

      # Path strategy for the NEAT-AI-core sibling (Issue #18):
      #   * `actions/checkout` refuses any `path:` that resolves outside
      #     `$GITHUB_WORKSPACE` (hence no `path: ../NEAT-AI-core`). We
      #     therefore clone NEAT-AI-core INTO the workspace as `NEAT-AI-core`.
      #   * Locally, `rust_scorer/Cargo.toml` points at
      #     `../../NEAT-AI-core/neat-core` (NEAT-AI-core is a SIBLING clone
      #     of NEAT-AI-scorer — see AGENTS.md).
      #   * The symlink step below bridges the two layouts so Cargo finds
      #     the expected sibling without the workflow having to rewrite
      #     Cargo.toml.
      - name: Checkout NEAT-AI-core (path dependency for neat-core)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          repository: stSoftwareAU/NEAT-AI-core
          ref: Develop
          path: NEAT-AI-core

      - name: Link NEAT-AI-core sibling path expected by Cargo
        run: |
          if [ ! -e "$GITHUB_WORKSPACE/../NEAT-AI-core" ]; then
            ln -s "$GITHUB_WORKSPACE/NEAT-AI-core" "$GITHUB_WORKSPACE/../NEAT-AI-core"
          fi

      - name: Free up runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/share/swift
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable, frozen 2026-05-18
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Fetch a prebuilt cargo-deny binary instead of compiling from source
      # on every run (Issue #208). taiki-e/install-action resolves a released
      # binary in seconds, matching the prior unversioned `cargo install`.
      - name: Install cargo-deny (prebuilt binary)
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912  # v2.81.10
        with:
          tool: cargo-deny

      - name: cargo deny
        run: cargo deny check

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run linter
        run: |
          cargo clippy --all-targets --all-features -- \
            -D warnings \
            -D clippy::filter_next \
            -D clippy::collapsible_if

      # No standalone `cargo check` step: the clippy step above drives the same
      # rustc front-end over the identical `--all-targets --all-features` scope
      # with `-D warnings`, so it is the strict type-check gate. A separate
      # `cargo check` could only pass once clippy already had, and clippy's
      # rustc wrapper means it would not reuse clippy's artefacts either —
      # pure redundant wall-clock on the heaviest job (Issue #403).
      - name: Build workspace
        run: cargo build --workspace

      - name: Clean intermediate artefacts before tests
        run: |
          df -h /
          find target -name "incremental" -type d -exec rm -rf {} + 2>/dev/null || true
          find target -name ".fingerprint" -type d -exec rm -rf {} + 2>/dev/null || true
          find target -name "build" -type d -exec rm -rf {} + 2>/dev/null || true
          df -h /

      - name: Run tests
        run: cargo test --workspace --all-features --verbose -- --test-threads=2

      - name: Build documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

  security:
    # Fan-in after `validation` keeps security audits aligned with the rest
    # of the graph — no advisory scan runs against a broken repo layout.
    needs: [validation]
    # The reusable security.yml writes check-run annotations and the
    # dependency-review PR summary comment, so the calling job must grant those
    # scopes explicitly: a called workflow's token can only be narrowed, never
    # elevated, along the caller chain. With the read-only workflow default
    # above, omitting this block would clamp security.yml's own `checks: write`
    # / `pull-requests: write` away. `issues: write` is intentionally omitted —
    # audit-check only files issues on non-PR events and this caller is PR-gated
    # (Issue #398). Mirrors the permissions declared in security.yml.
    permissions:
      contents: read
      checks: write
      pull-requests: write
    uses: ./.github/workflows/security.yml
    if: github.event_name == 'pull_request'
    with:
      # Opt out of the reusable workflow's dependency-review step (Issue #399).
      # The standalone `dependency-review.yml` runs the same action on every PR
      # — including PRs into `Develop` and `milestone/**` — so enabling it here
      # too only produced a duplicate verdict on the dominant path. The
      # standalone workflow is now the single dependency-review gate.
      include-dependency-review: false

  validation:
    name: Project Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          # validation only reads the tree (required-file check + cargo metadata)
          # and never pushes back, so the workflow GITHUB_TOKEN must not be
          # written to .git/config where a later step could read it (Issue #381).
          persist-credentials: false

      # NEAT-AI-core checkout path strategy — see note in the `quality` job
      # above. Summary: in-workspace clone + sibling symlink so Cargo resolves
      # the `../../NEAT-AI-core/neat-core` path dependency on the runner.
      - name: Checkout NEAT-AI-core (path dependency for neat-core)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          repository: stSoftwareAU/NEAT-AI-core
          ref: Develop
          path: NEAT-AI-core
          # This job only reads the neat-core tree (cargo metadata resolves the
          # path dependency); it never pushes back, so the token must not persist
          # on disk (Issue #381).
          persist-credentials: false

      - name: Link NEAT-AI-core sibling path expected by Cargo
        run: |
          if [ ! -e "$GITHUB_WORKSPACE/../NEAT-AI-core" ]; then
            ln -s "$GITHUB_WORKSPACE/NEAT-AI-core" "$GITHUB_WORKSPACE/../NEAT-AI-core"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable, frozen 2026-05-18

      - name: Check for required files
        run: |
          required_files=(
            "Cargo.toml"
            "README.md"
            "LICENSE"
            "CONTRIBUTING.md"
            "CHANGELOG.md"
            "quality.sh"
            "deny.toml"
            "rust-toolchain.toml"
            "rust_scorer/src/main.rs"
            ".github/CODEOWNERS"
            "SECURITY.md"
            "neat-core.expected-version"
          )
          missing_files=()
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              missing_files+=("$file")
            fi
          done
          if [ ${#missing_files[@]} -ne 0 ]; then
            echo "Missing required files: ${missing_files[*]}"
            exit 1
          fi

      - name: Validate Cargo workspace
        run: cargo metadata --no-deps --format-version 1 > /dev/null

      # Gate against an unhandled breaking neat-core bump (Issue #252). scorer
      # keeps the unpinned `path` dependency that tracks head, so this step
      # fails the build when the sibling neat-core's breaking component (major
      # for >= 1.0, minor for pre-1.0) climbs above the recorded baseline in
      # neat-core.expected-version — forcing a deliberate upgrade rather than
      # tracking head blindly. Reuses the neat-core checkout + sibling symlink
      # above; the default manifest path resolves via that symlink.
      - name: Gate on unhandled breaking neat-core bump
        run: ./scripts/check-neat-core-version.sh

  shell-checks:
    name: Shell Script Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Upstream ShellCheck project: https://github.com/koalaman/shellcheck
    # Invoked below via the `shellcheck` binary pre-installed on ubuntu-latest.

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      # NEAT-AI-core checkout path strategy — see note in the `quality` job.
      # Summary: in-workspace clone + sibling symlink so `cargo metadata`
      # (invoked by cargo_metadata.bats) resolves the path dependency.
      - name: Checkout NEAT-AI-core (path dependency for neat-core)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          repository: stSoftwareAU/NEAT-AI-core
          ref: Develop
          path: NEAT-AI-core
          # shell-checks only reads the tree (lint/syntax/bats) and never pushes
          # back, so the workflow GITHUB_TOKEN must not be written to .git/config
          # where a later step could read it (Issue #379).
          persist-credentials: false

      - name: Link NEAT-AI-core sibling path expected by Cargo
        run: |
          if [ ! -e "$GITHUB_WORKSPACE/../NEAT-AI-core" ]; then
            ln -s "$GITHUB_WORKSPACE/NEAT-AI-core" "$GITHUB_WORKSPACE/../NEAT-AI-core"
          fi

      - name: Check bash script syntax
        run: |
          EXIT_CODE=0
          while IFS= read -r script; do
            if bash -n "$script"; then
              echo "OK $script"
            else
              echo "FAIL $script"
              EXIT_CODE=1
            fi
          done < <(find . -name "*.sh" -not -path "./target/*" -not -path "./.git/*")
          exit $EXIT_CODE

      - name: Run ShellCheck (koalaman/shellcheck, pre-installed on the runner)
        # Invoke the ShellCheck binary pre-installed on ubuntu-latest rather
        # than downloading a release asset at job time. The previous
        # ludeeus/action-shellcheck wrapper fetched the binary with
        # `curl -Lso` (no `-f`), so a transient release-asset download
        # error saved an HTML error page and the tar/xz extraction failed
        # with "does not look like a tar archive" (exit 2). Using the
        # pre-installed binary removes that network dependency and also
        # drops a third-party action from the supply chain.
        env:
          SHELLCHECK_OPTS: -s bash
        run: |
          shellcheck --version
          scripts=()
          while IFS= read -r script; do
            scripts+=("$script")
          done < <(find . -name "*.sh" -not -path "./target/*" -not -path "./.git/*")
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No shell scripts found — nothing to lint"
            exit 0
          fi
          shellcheck --severity=warning "${scripts[@]}"

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run bash helper tests (bats)
        run: |
          if [ -d "tests/scripts" ]; then
            bats tests/scripts
          fi

  spell-check:
    name: Spell Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          # Spell check only reads the tree — it never pushes back or fetches a
          # private submodule — so the GITHUB_TOKEN must not be persisted into
          # .git/config where a later step could read it (Issue #380).
          persist-credentials: false

      # Configuration lives in `.codespellrc` at the repo root so CI and the
      # local preflight (`scripts/spell-check.sh`) stay in lock-step — see
      # Issue #22 and the README "Spell check" section. Invoke the same
      # script contributors run locally.
      - name: Install codespell
        run: pip install --user codespell

      - name: Run codespell preflight
        run: ./scripts/spell-check.sh

  # ------------------------------------------------------------------
  # Aggregator job — single stable required check for branch protection.
  # ------------------------------------------------------------------
  # Branch protection should pin exactly one required check: `CI Required
  # Checks`. This fan-in job depends on every gating job above and uses
  # `if: always()` so it always reports a result, even when an upstream job
  # failed. The explicit `needs.<job>.result` inspection below turns
  # `always()` into a real gate: the step exits non-zero unless every
  # dependency reported `success` (or `skipped`, which is the expected state
  # for `security` on push events where the dependency-review step is
  # deliberately disabled).
  #
  # Why an aggregator at all?
  # * Stable required-check name — adding/removing a gating job no longer
  #   requires a branch-protection update.
  # * Deterministic re-run behaviour — a re-run of a failed upstream job
  #   automatically re-runs the aggregator (GitHub re-evaluates fan-in
  #   dependents), so the required check reflects the latest state.
  # * Clear partial-failure semantics — the aggregator summarises *why* it
  #   failed in its log, pointing reviewers at the specific upstream.
  ci-required:
    name: CI Required Checks
    needs: [validation, quality, security, shell-checks, spell-check]
    if: always()
    runs-on: ubuntu-latest
    # Lightweight fan-in gate — only inspects upstream job results.
    timeout-minutes: 5
    steps:
      - name: Verify all gating jobs succeeded
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          SHELL_CHECKS_RESULT: ${{ needs.shell-checks.result }}
          SPELL_CHECK_RESULT: ${{ needs.spell-check.result }}
        run: |
          set -euo pipefail
          # Accept `success` (ran and passed) and `skipped` (e.g. `security`
          # on non-PR events). Anything else — failure, cancelled, timed
          # out — must fail the aggregator so branch protection blocks the
          # merge.
          fail=0
          check() {
            local name="$1" result="$2"
            if [[ "$result" == "success" || "$result" == "skipped" ]]; then
              echo "OK   $name: $result"
            else
              echo "FAIL $name: $result" >&2
              fail=1
            fi
          }
          check "validation"   "$VALIDATION_RESULT"
          check "quality"      "$QUALITY_RESULT"
          check "security"     "$SECURITY_RESULT"
          check "shell-checks" "$SHELL_CHECKS_RESULT"
          check "spell-check"  "$SPELL_CHECK_RESULT"
          if [[ "$fail" -ne 0 ]]; then
            echo "One or more gating jobs did not succeed — blocking merge." >&2
            exit 1
          fi
          echo "All gating jobs succeeded — safe to merge."
