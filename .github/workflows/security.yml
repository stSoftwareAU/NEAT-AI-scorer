name: Security Reusable Workflow

on:
  workflow_call:
    inputs:
      include-dependency-review:
        description: "Include dependency review"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  checks: write
  issues: write

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout NEAT-AI-core (path dependency for neat-core)
        uses: actions/checkout@v4
        with:
          repository: stSoftwareAU/NEAT-AI-core
          ref: Develop
          path: NEAT-AI-core

      - name: Link NEAT-AI-core sibling path expected by Cargo
        run: |
          if [ ! -e "$GITHUB_WORKSPACE/../NEAT-AI-core" ]; then
            ln -s "$GITHUB_WORKSPACE/NEAT-AI-core" "$GITHUB_WORKSPACE/../NEAT-AI-core"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Official RustSec GitHub Action — wraps cargo-audit and annotates the PR /
      # check run with any RUSTSEC advisories found in Cargo.lock.
      - name: Cargo Security Audit (rustsec/audit-check)
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Belt-and-braces: run cargo-audit directly so the job fails hard on
      # advisories even if the action's annotation path is disabled.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

      - name: Dependency review
        if: ${{ inputs.include-dependency-review && github.event_name == 'pull_request' }}
        uses: actions/dependency-review-action@v4
        with:
          comment-summary-in-pr: always
