name: Security Reusable Workflow

on:
  workflow_call:
    inputs:
      include-dependency-review:
        description: "Include dependency review"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  checks: write
  issues: write

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      # Path strategy for the NEAT-AI-core sibling (Issue #18):
      #   * `actions/checkout` refuses any `path:` that resolves outside
      #     `$GITHUB_WORKSPACE`, so we clone NEAT-AI-core INTO the workspace
      #     as `NEAT-AI-core`.
      #   * `rust_scorer/Cargo.toml` expects the sibling layout
      #     `../../NEAT-AI-core/neat-core` (see AGENTS.md). The symlink step
      #     below recreates that layout on the runner so Cargo resolves the
      #     path dependency without rewriting any manifest.
      - name: Checkout NEAT-AI-core (path dependency for neat-core)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          repository: stSoftwareAU/NEAT-AI-core
          ref: Develop
          path: NEAT-AI-core

      - name: Link NEAT-AI-core sibling path expected by Cargo
        run: |
          if [ ! -e "$GITHUB_WORKSPACE/../NEAT-AI-core" ]; then
            ln -s "$GITHUB_WORKSPACE/NEAT-AI-core" "$GITHUB_WORKSPACE/../NEAT-AI-core"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable, frozen 2026-05-18

      # Official RustSec GitHub Action — wraps cargo-audit and annotates the PR /
      # check run with any RUSTSEC advisories found in Cargo.lock.
      - name: Cargo Security Audit (rustsec/audit-check)
        # Master HEAD post upstream #48 (commit 858dc40, 2026-03-20) — action.yml
        # declares `using: node24`. The v2.0.0 tag (2024-09-23) still pins
        # node20, and no v2.1 / v3 tag has shipped yet, so we SHA-pin to the
        # master commit. Issue #136 cleared the prior Node 20 exception.
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432  # v2 (master HEAD, Node 24, post upstream #48)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Belt-and-braces: run cargo-audit directly so the job fails hard on
      # advisories even if the action's annotation path is disabled.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

      - name: Dependency review
        if: ${{ inputs.include-dependency-review && github.event_name == 'pull_request' }}
        # Bumped to v5.0.0 in Issue #136 — upstream shipped Node 24 on
        # 2026-05-08, clearing the prior tracked Node 20 exception.
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          comment-summary-in-pr: always
