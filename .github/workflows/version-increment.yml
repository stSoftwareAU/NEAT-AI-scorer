# Guarded auto-version increment PR job (Issue #20).
#
# Runs on pull requests targeting Develop or a milestone/* branch. If the
# Cargo package version in `rust_scorer/Cargo.toml` still matches the base
# branch, bumps the patch component once and commits the change back to the
# PR branch. Re-running CI or a human-authored bump on the branch both
# short-circuit via `scripts/version-increment.sh --run`, so no duplicate
# bump commits are produced.
name: Version Increment

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - Develop
      - "milestone/**"
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: write
  pull-requests: read

# This workflow commits and pushes back to the PR head branch, so a single
# in-flight run per branch avoids overlapping runs racing on the same ref.
concurrency:
  group: version-increment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate: establish a canonical "should we attempt a bump?" signal that the
  # actual writer job depends on. Making this a separate job keeps the
  # ordering explicit (per acceptance criteria) and lets other PR checks
  # pin themselves to `needs: [version-increment]` later if desired.
  guard:
    name: Version Bump Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Never attempt to push onto a fork's branch — bump-on-fork is the
    # PR author's responsibility.
    if: github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      should_bump: ${{ steps.check.outputs.should_bump }}
      next_version: ${{ steps.check.outputs.next_version }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base ref
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags --prune origin "$PR_BASE_REF"

      - name: Decide whether to bump
        id: check
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          base_ref="origin/$PR_BASE_REF"
          current="$(./scripts/version-increment.sh --get-version \
            --manifest rust_scorer/Cargo.toml)"
          if ./scripts/version-increment.sh --already-bumped \
              --manifest rust_scorer/Cargo.toml \
              --base-ref "$base_ref"; then
            echo "Version already bumped on branch — skipping."
            echo "should_bump=false" >>"$GITHUB_OUTPUT"
            echo "next_version=$current" >>"$GITHUB_OUTPUT"
          else
            next="$(./scripts/version-increment.sh --bump-patch \
              --manifest rust_scorer/Cargo.toml --dry-run)"
            echo "Planned bump: $current -> $next"
            echo "should_bump=true" >>"$GITHUB_OUTPUT"
            echo "next_version=$next" >>"$GITHUB_OUTPUT"
          fi

  bump:
    name: Apply Version Bump
    needs: guard
    if: needs.guard.outputs.should_bump == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          # Keep the job token off disk; push auth is injected only below
          # via ACTIONS_PUSH (Issue #435 / NEAT-AI ACTIONS_PUSH pattern).
          persist-credentials: false

      - name: Fetch base ref
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags --prune origin "$PR_BASE_REF"

      # Re-check just before writing to avoid a race where a bump landed
      # between the guard job and this job — preserves at-most-once semantics.
      - name: Perform guarded bump
        id: bump
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          base_ref="origin/$PR_BASE_REF"
          result="$(./scripts/version-increment.sh --run \
            --manifest rust_scorer/Cargo.toml \
            --base-ref "$base_ref")"
          echo "$result"
          if [[ "$result" == skip:* ]]; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
          fi

      # Push with the org-level ACTIONS_PUSH PAT so the resulting
      # `synchronize` event is attributed to a trusted identity and PR
      # checks run without the "Awaiting approval / Approve and run" gate
      # that GITHUB_TOKEN bot pushes create (Issue #435). Fall back to
      # GITHUB_TOKEN only when the secret is unset. The PAT is passed via
      # env + a per-command extraheader so it never lives in `.git/config`
      # (mirrors NEAT-AI update-package-version.yml).
      - name: Commit and push bump
        if: steps.bump.outputs.changed == 'true'
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          NEXT_VERSION: ${{ needs.guard.outputs.next_version }}
          GH_PAT: ${{ secrets.ACTIONS_PUSH || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust_scorer/Cargo.toml
          git commit -m "chore: auto-bump rust_scorer version to ${NEXT_VERSION}

          Closes part of #20 — guarded auto-version increment."
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_PAT" | base64 -w0)"
          git -c http.https://github.com/.extraheader="$AUTH_HEADER" \
            push origin "HEAD:$PR_HEAD_REF"
