# Auto-format PR job (Issue #19).
#
# Runs on pull requests targeting Develop or a milestone/* branch. Applies
# `cargo fmt --all` on the PR branch; if the working tree changes, the fix
# is committed and pushed back. Re-running on a clean branch is a no-op,
# so the job is safe/idempotent.
#
# Permissions are scoped to the minimum: `contents: write` to push the
# rustfmt commit. `pull-requests: read` is sufficient for the workflow's
# metadata needs — the job does not comment or label the PR.
name: Auto Format

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - Develop
      - "milestone/**"
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: write
  pull-requests: read

# This workflow commits and pushes back to the PR head branch, so a single
# in-flight run per branch avoids overlapping runs racing on the same ref.
concurrency:
  group: auto-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-format:
    name: Auto-format Code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skip forks — neither GITHUB_TOKEN nor ACTIONS_PUSH can push to a
    # fork's branch. Formatting on fork PRs is the author's responsibility.
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          # Keep the job token off disk; push auth is injected only below
          # via ACTIONS_PUSH (Issue #435 / NEAT-AI ACTIONS_PUSH pattern).
          persist-credentials: false

      # NEAT-AI-core is a path dependency required for `cargo fmt --all` to
      # resolve the workspace. The checkout + sibling symlink live in the
      # shared composite action (Issue #401).
      - name: Set up NEAT-AI-core sibling (path dependency for neat-core)
        uses: ./.github/actions/setup-neat-core

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable, frozen 2026-05-18
        with:
          components: rustfmt

      - name: Apply cargo fmt
        run: |
          set -euo pipefail
          cargo fmt --all

      # Resolve the commit message here, not in the push step below: the
      # helper is PR-head code, so running it alongside $GH_PAT would hand
      # the org PAT straight to an attacker-editable script (Issue #497).
      - name: Detect formatting changes
        id: detect
        run: |
          set -euo pipefail
          if ./scripts/auto-format.sh --check-changes; then
            echo "changed=true" >>"$GITHUB_OUTPUT"
          else
            echo "changed=false" >>"$GITHUB_OUTPUT"
          fi
          {
            echo "commit_message<<AUTO_FORMAT_COMMIT_MESSAGE_EOF"
            ./scripts/auto-format.sh --commit-message
            echo "AUTO_FORMAT_COMMIT_MESSAGE_EOF"
          } >>"$GITHUB_OUTPUT"

      # Push with the org-level ACTIONS_PUSH PAT so the resulting
      # `synchronize` event is attributed to a trusted identity and PR
      # checks run without the "Awaiting approval / Approve and run" gate
      # that GITHUB_TOKEN bot pushes create (Issue #435). Fall back to
      # GITHUB_TOKEN only when the secret is unset. The PAT is passed via
      # env + a per-command extraheader so it never lives in `.git/config`
      # (mirrors NEAT-AI update-package-version.yml).
      #
      # Earlier steps in this job run PR-head code, so this step is hardened
      # against in-job poisoning of the PAT (Issue #497): git and base64 are
      # pinned to absolute paths (immune to a $GITHUB_ENV PATH override —
      # base64 is piped $GH_PAT on stdin), every git invocation disables
      # repository hooks (a planted `.git/hooks/pre-commit` would otherwise run
      # with $GH_PAT in scope), and no repository script is executed here.
      # Enforced by `scripts/check-push-step-hardening.sh`.
      - name: Commit and push rustfmt fixes
        if: steps.detect.outputs.changed == 'true'
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          COMMIT_MESSAGE: ${{ steps.detect.outputs.commit_message }}
          GH_PAT: ${{ secrets.ACTIONS_PUSH || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          GIT=/usr/bin/git
          BASE64=/usr/bin/base64
          "$GIT" -c core.hooksPath=/dev/null config user.name "github-actions[bot]"
          "$GIT" -c core.hooksPath=/dev/null config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          "$GIT" -c core.hooksPath=/dev/null commit -am "$COMMIT_MESSAGE"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_PAT" | "$BASE64" -w0)"
          "$GIT" -c core.hooksPath=/dev/null \
            -c http.https://github.com/.extraheader="$AUTH_HEADER" \
            push origin "HEAD:$PR_HEAD_REF"
