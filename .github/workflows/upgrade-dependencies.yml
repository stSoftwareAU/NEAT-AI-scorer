# Weekly dependency bumps (same idea as NEAT-AI-Discovery).
#
# Behaviour rules enforced by scripts/check-upgrade-deps-workflow.sh
# (Issue #90 — PR #89 leaked `upgrade-dry-run.txt`, `upgrade.log`, and
# the NEAT-AI-core sibling clone into the merge commit, and the PR body
# said only "aborting upgrade due to dry run"):
#
#   1. `cargo upgrade` logs are written under `$RUNNER_TEMP/` so the
#      worktree never contains them.
#   2. `peter-evans/create-pull-request` is given `add-paths:` listing
#      only Cargo manifest/lock files. Anything else the runner left
#      behind (NEAT-AI-core checkout, target/, etc) stays out of the
#      commit.
#   3. The PR body shows a `git diff --stat` plus the per-line bumps
#      from `Cargo.lock` so the reviewer can see WHICH crates changed.
name: Upgrade Cargo Dependencies

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade:
    name: Upgrade dependencies and create PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          ref: Develop
          token: ${{ secrets.GITHUB_TOKEN }}

      # Path strategy for the NEAT-AI-core sibling (Issue #18):
      #   * `actions/checkout` refuses any `path:` that resolves outside
      #     `$GITHUB_WORKSPACE`, so we clone NEAT-AI-core INTO the workspace
      #     as `NEAT-AI-core`.
      #   * `rust_scorer/Cargo.toml` expects the sibling layout
      #     `../../NEAT-AI-core/neat-core` (see AGENTS.md). The symlink step
      #     below recreates that layout on the runner so Cargo (and therefore
      #     `cargo upgrade`) resolves the path dependency.
      - name: Checkout NEAT-AI-core (path dependency for neat-core)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          repository: stSoftwareAU/NEAT-AI-core
          ref: Develop
          path: NEAT-AI-core

      - name: Link NEAT-AI-core sibling path expected by Cargo
        run: |
          if [ ! -e "$GITHUB_WORKSPACE/../NEAT-AI-core" ]; then
            ln -s "$GITHUB_WORKSPACE/NEAT-AI-core" "$GITHUB_WORKSPACE/../NEAT-AI-core"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable, frozen 2026-05-18

      - name: Install cargo-edit
        run: cargo install cargo-edit

      - name: Upgrade dependencies
        run: |
          set -euo pipefail
          # Write logs OUTSIDE the worktree so the create-pull-request
          # action cannot accidentally stage them (Issue #90).
          cargo upgrade --dry-run 2>&1 | tee "${RUNNER_TEMP}/upgrade-dry-run.txt"
          cargo upgrade 2>&1 | tee "${RUNNER_TEMP}/upgrade.log"

      # Issue #90: only raise a PR when at least one Cargo.toml manifest
      # actually advanced. `cargo upgrade` always touches Cargo.lock to
      # refresh transitives, so a lockfile-only diff is not a meaningful
      # upgrade and should not generate a PR (see PR #89 for the noise
      # case this guards against).
      - name: Check for manifest changes
        id: changes
        run: |
          set -euo pipefail
          result="$(bash scripts/check-upgrade-has-changes.sh)"
          echo "$result" >> "$GITHUB_OUTPUT"
          if [[ "$result" == "changed=true" ]]; then
            git diff --stat -- 'Cargo.toml' '**/Cargo.toml' 'Cargo.lock'
          else
            echo "No Cargo.toml manifest changes — skipping PR (Cargo.lock-only drift is not a meaningful upgrade)."
          fi

      - name: Update Cargo.lock
        if: steps.changes.outputs.changed == 'true'
        run: cargo update

      - name: Build summary
        if: steps.changes.outputs.changed == 'true'
        id: summary
        run: |
          set -euo pipefail
          # Capture the actual diff and the version-line changes from
          # Cargo.lock so the PR body answers "did anything change?"
          # at a glance. Issue #90 / PR #89 only showed the dry-run
          # epilogue ("aborting upgrade due to dry run"), which was
          # the regression we are fixing.
          DIFF_STAT="$(git diff --stat -- 'Cargo.toml' '**/Cargo.toml' 'Cargo.lock' || true)"
          LOCK_BUMPS="$(git diff -U0 -- 'Cargo.lock' \
            | grep -E '^[+-]version[[:space:]]*=' \
            | sed 's/^/    /' || true)"
          MANIFEST_BUMPS="$(git diff -U0 -- 'Cargo.toml' '**/Cargo.toml' \
            | grep -E '^[+-][a-zA-Z0-9_-]+[[:space:]]*=.*"[^"]+"' \
            | grep -vE '^(\+\+\+|---)' \
            | sed 's/^/    /' || true)"
          {
            echo 'body<<BODY_EOF'
            echo '## Dependency Upgrades'
            echo ''
            echo '### Files changed (git diff --stat)'
            echo '```'
            echo "$DIFF_STAT"
            echo '```'
            echo ''
            if [ -n "$MANIFEST_BUMPS" ]; then
              echo '### Manifest bumps (Cargo.toml)'
              echo '```diff'
              echo "$MANIFEST_BUMPS"
              echo '```'
              echo ''
            fi
            if [ -n "$LOCK_BUMPS" ]; then
              echo '### Lockfile version changes (Cargo.lock)'
              echo '```diff'
              echo "$LOCK_BUMPS"
              echo '```'
              echo ''
            fi
            echo '### cargo upgrade --dry-run summary'
            echo '```'
            cat "${RUNNER_TEMP}/upgrade-dry-run.txt"
            echo '```'
            echo ''
            echo 'This PR was automatically generated by the scheduled dependency upgrade workflow.'
            echo 'BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Restrict the commit to Cargo manifest/lock files only. The
          # NEAT-AI-core sibling clone, target/, and the upgrade logs in
          # $RUNNER_TEMP must not leak into the PR (Issue #90).
          add-paths: |
            Cargo.toml
            **/Cargo.toml
            Cargo.lock
          branch: chore/upgrade-dependencies
          base: Develop
          title: "chore: upgrade Cargo dependencies to latest compatible versions"
          body: ${{ steps.summary.outputs.body }}
          commit-message: "chore: upgrade Cargo.toml dependencies to latest compatible versions"
          committer: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          delete-branch: true
