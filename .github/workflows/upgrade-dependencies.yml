# Weekly dependency bumps (same idea as NEAT-AI-Discovery).
name: Upgrade Cargo Dependencies

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade:
    name: Upgrade dependencies and create PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: Develop
          token: ${{ secrets.GITHUB_TOKEN }}

      # Path strategy for the NEAT-AI-core sibling (Issue #18):
      #   * `actions/checkout` refuses any `path:` that resolves outside
      #     `$GITHUB_WORKSPACE`, so we clone NEAT-AI-core INTO the workspace
      #     as `NEAT-AI-core`.
      #   * `rust_scorer/Cargo.toml` expects the sibling layout
      #     `../../NEAT-AI-core/neat-core` (see AGENTS.md). The symlink step
      #     below recreates that layout on the runner so Cargo (and therefore
      #     `cargo upgrade`) resolves the path dependency.
      - name: Checkout NEAT-AI-core (path dependency for neat-core)
        uses: actions/checkout@v5
        with:
          repository: stSoftwareAU/NEAT-AI-core
          ref: Develop
          path: NEAT-AI-core

      - name: Link NEAT-AI-core sibling path expected by Cargo
        run: |
          if [ ! -e "$GITHUB_WORKSPACE/../NEAT-AI-core" ]; then
            ln -s "$GITHUB_WORKSPACE/NEAT-AI-core" "$GITHUB_WORKSPACE/../NEAT-AI-core"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-edit
        run: cargo install cargo-edit

      - name: Upgrade dependencies
        run: |
          cargo upgrade --dry-run 2>&1 | tee upgrade-dry-run.txt || true
          cargo upgrade 2>&1 | tee upgrade.log || true

      # Issue #90: only raise a PR when at least one Cargo.toml manifest
      # actually advanced. `cargo upgrade` always touches Cargo.lock to
      # refresh transitives, so a lockfile-only diff is not a meaningful
      # upgrade and should not generate a PR (see PR #89 for the noise
      # case this guards against).
      - name: Check for manifest changes
        id: changes
        run: |
          result="$(bash scripts/check-upgrade-has-changes.sh)"
          echo "$result" >> "$GITHUB_OUTPUT"
          if [[ "$result" == "changed=true" ]]; then
            git diff --stat -- 'Cargo.toml' '**/Cargo.toml' 'Cargo.lock'
          else
            echo "No Cargo.toml manifest changes — skipping PR (Cargo.lock-only drift is not a meaningful upgrade)."
          fi

      - name: Update Cargo.lock
        if: steps.changes.outputs.changed == 'true'
        run: cargo update

      - name: Build summary
        if: steps.changes.outputs.changed == 'true'
        id: summary
        run: |
          {
            echo 'body<<EOF'
            echo '## Dependency Upgrades'
            echo ''
            echo '### Changes'
            echo '```'
            cat upgrade-dry-run.txt
            echo '```'
            echo ''
            echo 'This PR was automatically generated by the scheduled dependency upgrade workflow.'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/upgrade-dependencies
          base: Develop
          title: "chore: upgrade Cargo dependencies to latest compatible versions"
          body: ${{ steps.summary.outputs.body }}
          commit-message: "chore: upgrade Cargo.toml dependencies to latest compatible versions"
          committer: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          delete-branch: true
