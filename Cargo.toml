# Native scorer CLI; `neat-core` comes from the NEAT-AI-core repository (see `rust_scorer/Cargo.toml`).
[workspace]
members = ["rust_scorer"]
resolver = "2"

# Fast rebuilds: keep panic file:line, drop full DWARF (Issue #568).
# Default opt-level = 0 and incremental compilation stay.
[profile.dev]
debug = "line-tables-only"

# Fully optimised artefact — compile time is irrelevant (Issue #568).
# Workspace-wide (not `[profile.release.package.<name>]`); `lto = "fat"` is the
# explicit spelling of fat LTO (`lto = true` is equivalent).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.release.package."*"]
opt-level = 3

# `profiling`: release optimisations plus debug symbols so `sample`/`dtrace`/
# `perf` can produce a useful flamegraph. See `scripts/profile-flamegraph.sh`
# and `docs/performance-baseline.md` (Issue #37).
[profile.profiling]
inherits = "release"
debug = true
strip = false

# `pgo`: release optimisations used by the Profile-Guided Optimisation flow.
# `scripts/build-pgo.sh` builds twice with this profile — first instrumented
# (`-Cprofile-generate`), then with the merged profile (`-Cprofile-use`) — so
# the fat-LTO + codegen-units = 1 settings stay identical across both compiler
# passes. See Issue #43 and the "Optimised release build (PGO)" section in
# `README.md`.
[profile.pgo]
inherits = "release"

[profile.pgo.package."*"]
opt-level = 3

[workspace.lints.rust]
# Crate-level rustc lint hardening (Issue #274). Denies the rustc lint groups
# that a Clippy-only posture leaves unenforced at the source-tree level, so a
# local build catches the regression at the point it is introduced rather than
# relying solely on a CI `-D warnings` flag. Per-lint denies (not a blanket
# `#![deny(warnings)]`) keep a future compiler warning from breaking the build
# unexpectedly. `missing_docs` is a `warn` scoped to the library surface via
# `#![warn(missing_docs)]` in `rust_scorer/src/lib.rs` — the binary targets are
# doc-noisy, so it is intentionally NOT set here.
unsafe_op_in_unsafe_fn = "deny"
unused = "deny"

[workspace.lints.clippy]
collapsible_if = "deny"
filter_next = "deny"
doc_nested_refdefs = "allow"
identity_op = "allow"
manual_is_multiple_of = "allow"
manual_memcpy = "allow"
missing_const_for_thread_local = "allow"
needless_late_init = "allow"
needless_range_loop = "allow"
neg_multiply = "allow"
same_item_push = "allow"
too_many_arguments = "allow"
uninlined_format_args = "allow"
unnecessary_cast = "allow"
