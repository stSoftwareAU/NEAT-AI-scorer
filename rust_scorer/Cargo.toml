[package]
name = "rust_scorer"
version = "0.5.5"
edition = "2024"
license = "Apache-2.0"
description = "Native CLI binary for scoring NEAT-AI creatures against training data."

[lints]
workspace = true

[[bin]]
name = "rust_scorer"
path = "src/main.rs"

[[bin]]
name = "float_scan_bench"
path = "src/bin/float_scan_bench.rs"

[dependencies]
# Path relative to this file: `NEAT-AI-scorer/rust_scorer` → sibling `NEAT-AI-core/neat-core`.
# CI checks out NEAT-AI-core to `../../NEAT-AI-core` (see `.github/workflows/ci.yml`).
neat-core = { path = "../../NEAT-AI-core/neat-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.12"

[dev-dependencies]
tempfile = "3"
