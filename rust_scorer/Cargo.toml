[package]
name = "rust_scorer"
version = "1.1.5"
edition = "2024"
license = "Apache-2.0"
description = "Native CLI binary for scoring NEAT-AI creatures against training data."
# Rust API Guidelines C-METADATA (Issue #117): downstream tooling
# (cargo publish, SBOMs, cargo doc, IDE tooltips) needs the canonical
# source URL. The workspace README lives at the repository root rather
# than the crate root, so `readme` points there.
repository = "https://github.com/stSoftwareAU/NEAT-AI-scorer"
readme = "../README.md"

[lints]
workspace = true

[lib]
name = "rust_scorer"
path = "src/lib.rs"

[[bin]]
name = "rust_scorer"
path = "src/main.rs"

[[bin]]
name = "float_scan_bench"
path = "src/bin/float_scan_bench.rs"

# Per-cost CPU throughput bench (Issue #124). Sister to `float_scan_bench` —
# drives `accumulate_cost_sum_forward_only_fused` for every supported
# `CostKind` so each non-MSE cost gets the bench-and-decide step the parent
# issue (#119) defers GPU kernel work behind.
[[bin]]
name = "cost_scan_bench"
path = "src/bin/cost_scan_bench.rs"

# Allocator-pressure bench for the pipelined GPU directory path (Issue #202).
# Counts heap allocations during a multi-chunk `inflight_chunks == 2` run so the
# per-chunk `to_vec()` removal can be measured before/after. Skips on CPU hosts.
[[bin]]
name = "gpu_pipeline_alloc_bench"
path = "src/bin/gpu_pipeline_alloc_bench.rs"

# Criterion bench harness — see `benches/scoring.rs` and
# `docs/performance-baseline.md`. Not wired into `quality.sh` (Criterion runs
# are slow and non-deterministic enough to be unsuitable as a merge gate);
# reproduce with `./scripts/run-benches.sh` or `cargo bench -p rust_scorer`.
[[bench]]
name = "scoring"
path = "benches/scoring.rs"
harness = false

[dependencies]
# Path relative to this file: `NEAT-AI-scorer/rust_scorer` → sibling `NEAT-AI-core/neat-core`.
# CI clones NEAT-AI-core INSIDE the workspace at `NEAT-AI-core/` (an
# out-of-workspace `path:` is rejected by `actions/checkout` — see Issue #18)
# and then symlinks `$GITHUB_WORKSPACE/../NEAT-AI-core` to that clone so this
# `../../NEAT-AI-core/neat-core` path still resolves. See `.github/workflows/*.yml`.
neat-core = { path = "../../NEAT-AI-core/neat-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.12"
# GPU plumbing (Issue #80). Versions mirrored from NEAT-AI-Discovery so the
# GPU stack stays consistent across repos. Default `wgpu` features include all
# native backends; opt-in is gated by `--gpu` / `NEAT_SCORER_GPU` so the CPU
# path is unaffected.
wgpu = "29"
pollster = "0.4"
bytemuck = "1.25"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }
