[package]
name = "rust_scorer"
version = "0.5.24"
edition = "2024"
license = "Apache-2.0"
description = "Native CLI binary for scoring NEAT-AI creatures against training data."

[lints]
workspace = true

[lib]
name = "rust_scorer"
path = "src/lib.rs"

[[bin]]
name = "rust_scorer"
path = "src/main.rs"

[[bin]]
name = "float_scan_bench"
path = "src/bin/float_scan_bench.rs"

# Criterion bench harness — see `benches/scoring.rs` and
# `docs/performance-baseline.md`. Not wired into `quality.sh` (Criterion runs
# are slow and non-deterministic enough to be unsuitable as a merge gate);
# reproduce with `./scripts/run-benches.sh` or `cargo bench -p rust_scorer`.
[[bench]]
name = "scoring"
path = "benches/scoring.rs"
harness = false

[dependencies]
# Path relative to this file: `NEAT-AI-scorer/rust_scorer` → sibling `NEAT-AI-core/neat-core`.
# CI clones NEAT-AI-core INSIDE the workspace at `NEAT-AI-core/` (an
# out-of-workspace `path:` is rejected by `actions/checkout` — see Issue #18)
# and then symlinks `$GITHUB_WORKSPACE/../NEAT-AI-core` to that clone so this
# `../../NEAT-AI-core/neat-core` path still resolves. See `.github/workflows/*.yml`.
neat-core = { path = "../../NEAT-AI-core/neat-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.12"
# GPU plumbing (Issue #80). Versions mirrored from NEAT-AI-Discovery so the
# GPU stack stays consistent across repos. Default `wgpu` features include all
# native backends; opt-in is gated by `--gpu` / `NEAT_SCORER_GPU` so the CPU
# path is unaffected.
wgpu = "29"
pollster = "0.4"
bytemuck = "1.25"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }
